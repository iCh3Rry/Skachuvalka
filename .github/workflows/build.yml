# Автоматична збірка VideoGrab для Windows і macOS на GitHub Actions.
# Результати (інсталятори + підписи) завантажуються як ассети релізу.
#
# Як користуватися:
# 1. Додайте секрет репозиторію SIGNING_KEY: вміст sign/key.rsa
#    (cat videograb/sign/key.rsa).
# 2. Додайте секрет SIGNING_KEY_PASSWORD: пароль із .env файлу
#    (TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
# 3. Створіть реліз через GitHub UI (наприклад, тег v1.0.1) — воркфлоу
#    збереться, підпише артефакти й додасть їх до релізу.
# 4. Для macOS-білдів додайте також секрети APPLE_CERTIFICATE,
#    APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#    APPLE_ID, APPLE_TEAM_ID, APPLE_PASSWORD (подивіться документацію
#    https://v2.tauri.app/distribute/sign/macos/).
#    Якщо сертифікатів немає — встановіть TAURI_MACOS_SIGN: false,
#    артефакти зберуться без підпису Apple (користувачеві доведеться
#    натиснути "Відкрити" в macOS).

name: Build VideoGrab

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Завантажити yt-dlp та ffmpeg для Windows
        run: |
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile videograb/src-tauri/resources/yt-dlp-bundled.exe
          Invoke-WebRequest -Uri https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz -OutFile ffmpeg-win.gz
          [System.IO.Compression.GzipStream]::new([System.IO.File]::OpenRead("ffmpeg-win.gz"), [System.IO.Compression.CompressionMode]::Decompress).CopyTo([System.IO.File]::Create("videograb/src-tauri/resources/ffmpeg-bundled.exe"))
          Remove-Item ffmpeg-win.gz

      - name: Встановити залежності
        run: |
          pnpm install
          pnpm exec tauri add updater dialog process opener

      - name: Вставити ключ підпису
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "${{ env.SIGNING_KEY }}" > videograb/sign/key.rsa
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ env.SIGNING_KEY_PASSWORD }}" >> $env:GITHUB_ENV

      - name: Збірка (NSIS + MSI)
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Додати артефакти до релізу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            videograb/src-tauri/target/release/bundle/nsis/*.exe
            videograb/src-tauri/target/release/bundle/nsis/*.exe.sig
            videograb/src-tauri/target/release/bundle/msi/*.msi
            videograb/src-tauri/target/release/bundle/msi/*.msi.sig

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Завантажити yt-dlp та ffmpeg для macOS (universal)
        run: |
          curl -L -o videograb/src-tauri/resources/yt-dlp-bundled \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x videograb/src-tauri/resources/yt-dlp-bundled
          curl -L -o videograb/src-tauri/resources/ffmpeg-bundled-x64 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz
          curl -L -o videograb/src-tauri/resources/ffmpeg-bundled-arm64 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz
          gunzip -f videograb/src-tauri/resources/ffmpeg-bundled-x64
          gunzip -f videograb/src-tauri/resources/ffmpeg-bundled-arm64
          chmod +x videograb/src-tauri/resources/ffmpeg-bundled-x64 videograb/src-tauri/resources/ffmpeg-bundled-arm64

      - name: Встановити залежності
        run: |
          pnpm install
          pnpm exec tauri add updater dialog process opener

      - name: Вставити ключ підпису
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p videograb/sign
          echo "$SIGNING_KEY" > videograb/sign/key.rsa
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Збірка DMG
        run: pnpm tauri build --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Додати DMG до релізу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            videograb/src-tauri/target/*/release/bundle/dmg/*.dmg
            videograb/src-tauri/target/*/release/bundle/dmg/*.dmg.sig
