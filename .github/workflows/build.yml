# Автоматична збірка VideoGrab для Windows і macOS на GitHub Actions.
# Результати (інсталятори + підписи) завантажуються як ассети релізу.
#
# Як користуватися:
# 1. Додайте секрет репозиторію SIGNING_KEY: вміст sign/key.rsa
#    (cat sign/key.rsa).
# 2. Додайте секрет SIGNING_KEY_PASSWORD: пароль із .env файлу
#    (TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
# 3. Створіть реліз через GitHub UI (наприклад, тег v1.0.1) — воркфлоу
#    збереться, підпише артефакти й додасть їх до релізу.
# 4. Для macOS-білдів додайте також секрети APPLE_CERTIFICATE,
#    APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#    APPLE_ID, APPLE_TEAM_ID, APPLE_PASSWORD (подивіться документацію
#    https://v2.tauri.app/distribute/sign/macos/).
#    Якщо сертифікатів немає — встановіть TAURI_MACOS_SIGN: false,
#    артефакти зберуться без підпису Apple (користувачеві доведеться
#    натиснути "Відкрити" в macOS).

name: Build VideoGrab

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache (registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-win-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cargo cache (target)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-win-target-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: cargo-win-target-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Завантажити yt-dlp та ffmpeg для Windows
        run: |
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/resources/yt-dlp-bundled.exe
          curl.exe -L -o ffmpeg-win.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz
          gunzip -f -c ffmpeg-win.gz > src-tauri/resources/ffmpeg-bundled.exe
          Remove-Item ffmpeg-win.gz

      - name: Встановити залежності
        run: |
          pnpm install

      - name: Вставити ключ підпису
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path sign | Out-Null
          Set-Content -Path sign/key.rsa -Value $env:SIGNING_KEY -Encoding Ascii
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" -Encoding Ascii

      - name: Збірка (NSIS + MSI)
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Завантажити артефакти (завжди, навіть без тегу)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: videograb-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Додати артефакти до релізу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cargo cache (registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-mac-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cargo cache (target)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-mac-target-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: cargo-mac-target-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Завантажити yt-dlp та ffmpeg для macOS (universal)
        run: |
          curl -L -o src-tauri/resources/yt-dlp-bundled \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x src-tauri/resources/yt-dlp-bundled
          curl -L -o src-tauri/resources/ffmpeg-bundled-x64.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz
          curl -L -o src-tauri/resources/ffmpeg-bundled-arm64.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz
          gunzip -f src-tauri/resources/ffmpeg-bundled-x64.gz
          gunzip -f src-tauri/resources/ffmpeg-bundled-arm64.gz
          chmod +x src-tauri/resources/ffmpeg-bundled-x64 src-tauri/resources/ffmpeg-bundled-arm64

      - name: Встановити залежності
        run: |
          pnpm install

      - name: Вставити ключ підпису
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p sign
          printf '%s\n' "$SIGNING_KEY" > sign/key.rsa
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Збірка DMG (без підпису Apple, поки немає сертифікатів)
        run: pnpm tauri build --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Завантажити DMG як артефакт (якщо немає тегу)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: videograb-macos
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz

      - name: Підготувати DMG до релізу
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "DMG готовий до публікації (підпис для updater створює Tauri — .app.tar.gz.sig)"

      - name: Додати DMG до релізу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.tar.gz.sig
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz

  publish-updater:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Створити latest.json і додати до релізу
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          API=https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG
          REL=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$API" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Release id: $REL"
          # Видалити старий latest.json, якщо він вже є (щоб не було конфлікта імен)
          OLD_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$API" | python3 -c "import json,sys; d=json.load(sys.stdin); ids=[a['id'] for a in d['assets'] if a['name']=='latest.json']; print(ids[0] if ids else '')")
          if [ -n "$OLD_ID" ]; then
            echo "Видаляємо старий latest.json (asset id $OLD_ID)…"
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$OLD_ID"
          fi
          mkdir -p /tmp/ra
          curl -sL -o /tmp/ra/app.sig "https://github.com/iCh3Rry/Skachuvalka/releases/download/$TAG/VideoGrab.app.tar.gz.sig"
          curl -sL -o /tmp/ra/exe.sig "https://github.com/iCh3Rry/Skachuvalka/releases/download/$TAG/VideoGrab_${VER}_x64-setup.exe.sig"
          curl -sL -o /tmp/ra/msi.sig "https://github.com/iCh3Rry/Skachuvalka/releases/download/$TAG/VideoGrab_${VER}_x64_en-US.msi.sig"
          python3 - "$VER" <<'PYEOF' > /tmp/ra/latest.json
          import json,sys,base64
          ver = sys.argv[1]
          def sig(f):
              with open(f,'rb') as fh: data=fh.read()
              try: text = base64.b64decode(data).decode()
              except Exception: text = data.decode()
              # The Tauri updater expects the `signature` field to be a
              # base64-encoded minisign text signature, so encode it here.
              return base64.b64encode(text.strip().encode()).decode()
          # macOS updater: verify_signature runs on downloaded bytes and then
          # install_inner expects a .app.tar.gz (gzip+tar), so the darwin URL
          # must point to the .app.tar.gz asset signed as VideoGrab.app.tar.gz.sig
          darwin_url = "https://github.com/iCh3Rry/Skachuvalka/releases/download/v"+ver+"/VideoGrab.app.tar.gz"
          manifest = {
            "version": ver,
            "notes": "",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64-app": {"signature": sig('/tmp/ra/app.sig'), "url": darwin_url},
              "darwin-aarch64": {"signature": sig('/tmp/ra/app.sig'), "url": darwin_url},
              "darwin-universal": {"signature": sig('/tmp/ra/app.sig'), "url": darwin_url},
              "windows-x86_64": {"signature": sig('/tmp/ra/exe.sig'), "url": "https://github.com/iCh3Rry/Skachuvalka/releases/download/v"+ver+"/VideoGrab_"+ver+"_x64-setup.exe"},
              "windows-x86_64.msi": {"signature": sig('/tmp/ra/msi.sig'), "url": "https://github.com/iCh3Rry/Skachuvalka/releases/download/v"+ver+"/VideoGrab_"+ver+"_x64_en-US.msi"}
            }
          }
          print(json.dumps(manifest))
          PYEOF
          sed -i "s/\$(date -u +%Y-%m-%dT%H:%M:%SZ)/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" /tmp/ra/latest.json
          echo "Завантажуємо latest.json до релізу…"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL/assets?name=latest.json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/ra/latest.json)
          echo "upload HTTP: $HTTP"
          if [ "$HTTP" != "201" ]; then
            echo "Помилка завантаження latest.json (HTTP $HTTP)"
            exit 1
          fi
          echo "ОК: latest.json опубліковано для версії $VER"
